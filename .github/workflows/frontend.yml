name: React workspace

on:
  pull_request:
    paths: ["frontend/**", "agents/sre_agent/web_api.py", "tests/test_workspace_api.py", ".github/workflows/frontend.yml"]
  push:
    branches: [main, develop]
    paths: ["frontend/**", "agents/sre_agent/web_api.py", "tests/test_workspace_api.py", ".github/workflows/frontend.yml"]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build && npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: react-playwright-traces
          path: frontend/test-results

  workspace-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install fastapi httpx pytest pytest-asyncio
      - run: python -m pytest tests/test_workspace_api.py -q
